<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级配置</title>
  <script type="module" crossorigin src="/assets/admin-FJkbHmsc.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/navbar-CotlZ6UT.js">
  <link rel="modulepreload" crossorigin href="/assets/escape-html-CDFX0WEg.js">
  <link rel="modulepreload" crossorigin href="/assets/dropdown-select-BlZtU9Fp.js">
  <link rel="modulepreload" crossorigin href="/assets/toggle-OKKuqh4C.js">
  <link rel="stylesheet" crossorigin href="/assets/navbar-Bdr1sdEw.css">
  <link rel="stylesheet" crossorigin href="/assets/admin-CjabMmaX.css">
</head>
<body class="admin-page m-0 text-sm leading-normal text-[var(--color-text)] bg-[var(--color-page-bg)] font-sans antialiased">
    <div id="app" class="admin-shell mx-auto w-full max-w-[1440px]">
        <div id="empty-state" class="auth-gate flex min-h-[calc(100vh-var(--spacing-navbar))] items-center justify-center px-6 py-12">
            <div class="w-full max-w-[400px] rounded-xl border border-[var(--color-border)] bg-white px-7 py-8 shadow-[0_8px_28px_rgb(0_0_0/0.06)]">
                <header class="text-center">
                    <h1 class="m-0 text-[22px] font-semibold tracking-tight">高级配置</h1>
                    <p class="mt-2 text-sm text-[var(--color-text-muted)]">管理用户账号、IM 渠道绑定与 guest 默认配置归属</p>
                </header>
                <div id="auth-mount" class="mt-4"></div>
                <p id="auth-error" class="field-error mt-2.5 hidden"></p>
            </div>
        </div>

        <div id="forbidden-state" class="hidden flex min-h-[calc(100vh-var(--spacing-navbar))] items-center justify-center px-6 py-12">
            <div class="w-full max-w-[400px] rounded-xl border border-[var(--color-border)] bg-white px-7 py-8 text-center shadow-[0_8px_28px_rgb(0_0_0/0.06)]">
                <h1 class="m-0 text-lg font-semibold">无权限</h1>
                <p class="mt-2 text-sm text-[var(--color-text-muted)]">高级配置仅超级管理员可访问</p>
            </div>
        </div>

        <div id="workspace" class="admin-workspace hidden">
            <header class="page-hero">
                <h1 class="page-hero__title">高级配置</h1>
                <p class="page-hero__sub">管理用户账号、IM 渠道绑定与 guest 默认配置归属</p>
            </header>

            <div id="section-tabs" class="section-tabs" role="tablist" aria-label="高级配置分区">
                <button type="button" class="section-tab" role="tab" id="tab-users" aria-selected="true" aria-controls="pane-users" data-tab="users">用户管理</button>
                <button type="button" class="section-tab" role="tab" id="tab-channels" aria-selected="false" aria-controls="pane-channels" data-tab="channels">渠道管理</button>
            </div>

            <div class="tab-content">
                <div class="tab-pane" role="tabpanel" id="pane-users" aria-labelledby="tab-users">
                    <div class="users-layout">
                        <section id="seed-panel" class="panel"></section>
                        <section id="users-panel" class="panel"></section>
                    </div>
                </div>

                <div class="tab-pane hidden" role="tabpanel" id="pane-channels" aria-labelledby="tab-channels" hidden>
                    <div class="channel-layout">
                        <aside class="channel-rail" aria-label="渠道列表">
                            <p class="channel-rail__label">渠道</p>
                            <nav id="channel-rail" class="flex flex-col gap-2"></nav>
                        </aside>
                        <div id="channel-main" class="channel-main flex flex-col gap-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
