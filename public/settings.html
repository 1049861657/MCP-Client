<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI配置管理 - MCP演示</title>
  <script type="module" crossorigin src="/assets/settings-PUjZgt81.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/navbar-B50aCHnt.js">
  <link rel="modulepreload" crossorigin href="/assets/modal-CV_JZY2O.js">
  <link rel="modulepreload" crossorigin href="/assets/toast-CPsGmdIz.js">
  <link rel="stylesheet" crossorigin href="/assets/navbar-DDaLc_Td.css">
  <link rel="stylesheet" crossorigin href="/assets/settings-BcCUtord.css">
</head>
<body class="settings-page">
    <aside class="settings-sidebar" aria-label="提供商列表">
        <div class="settings-sidebar-inner">
            <p class="settings-sidebar-label">提供商</p>
            <nav id="sidebar-providers-list" class="settings-sidebar-list" role="tablist"></nav>
            <button type="button" id="add-provider" class="settings-add-btn">
                <span class="settings-add-icon" aria-hidden="true">+</span>
                添加提供商
            </button>
            <footer class="settings-sidebar-foot">
                <label class="settings-default-label" for="default-provider">默认提供商</label>
                <select id="default-provider" class="settings-default-select"></select>
            </footer>
        </div>
    </aside>

    <main class="settings-main">
        <div id="providers-container" class="settings-cards"></div>

        <footer class="settings-action-bar">
            <button type="button" id="save-providers" class="btn-primary">保存配置</button>
        </footer>
    </main>

</body>
</html>
